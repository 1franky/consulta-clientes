# Sentencias de cada listado (VbnListadoCarteras\Scripts). Van dentro del programa; para cambiar una
# sin recompilar, escribir la misma clave en config.properties, que tiene prioridad.
#
# :cliente se reemplaza por el número de cliente (@NumCte) y :corte por la fecha de corte.
# Algunos procedimientos no devuelven filas: dejan el resultado en una tabla tmp*, por eso
# van seguidos de un SELECT. Los procedimientos crean y borran tablas tmp* en dbo; el validador
# ejecuta cada listado en una transacción que se deshace al terminar (ROLLBACK).
sp.directorio=EXEC dbo.spcQCDirectorio :cliente
sp.credito=EXEC dbo.spcQCCredito :cliente; SELECT * FROM dbo.tmpQCCredito01
sp.muebles=EXEC dbo.spcQCMuebles :cliente
sp.ropa=EXEC dbo.spcQCRopa :cliente
# @iFechaConCorteAl20 = 1: corte al 20
sp.prestamos=EXEC dbo.spcQCPrestamos :cliente, 1
sp.tiempoAire=EXEC dbo.spcQCarteraTiempoAire :cliente
sp.deudaBancoppel=EXEC dbo.spcListadoClientesDeudaBancoppel :cliente
sp.reestructuras=EXEC dbo.spcQCReestructuras :cliente
sp.cpMuebles=EXEC dbo.spcQCCPMuebles :cliente
sp.cpRopa=EXEC dbo.spcQCCPRopa :cliente
sp.cpPrestamos=EXEC dbo.spcQCCPPrestamos :cliente
# El procedimiento solo crea tmpDineroElectronico3 si fun_ObtenerConfiguracionFlag(7) es 0 o 1
sp.dineroElectronico=EXEC dbo.spcQCDineroElectronico :cliente; IF OBJECT_ID('dbo.tmpDineroElectronico3') IS NOT NULL SELECT * FROM dbo.tmpDineroElectronico3
sp.informativa=EXEC dbo.proc_carterainformativa :cliente; SELECT * FROM dbo.tmp_CteSituacionEsp
sp.marcasContacto=EXEC dbo.proc_clientenocontactado :cliente; SELECT * FROM dbo.tmp_clientenocontactado
# Iniciales de la ciudad del cliente (ACYN), tercer renglón de los datos del cliente
sp.inicialCiudad=SELECT c.InicialCiudad FROM dbo.maeDirectorio d JOIN dbo.CatCiudades c ON c.NumeroCiudad = d.NumeroCiudad WHERE d.NumeroCliente = :cliente

# Sentencias de cada listado (VbnListadoCarteras\Scripts). Van dentro del programa; para cambiar una
# sin recompilar, escribir la misma clave en config.properties, que tiene prioridad.
#
# :cliente se reemplaza por el número de cliente (@NumCte) y :corte por la fecha de corte.
# Algunos procedimientos no devuelven filas: dejan el resultado en una tabla tmp*, por eso
# van seguidos de un SELECT. Los procedimientos crean y borran tablas tmp* en dbo; el validador
# ejecuta cada listado en una transacción que se deshace al terminar (ROLLBACK).
# Fecha a la que están los datos; los procedimientos la usan como su fecha de corte
sp.fechaDatos=SELECT TOP 1 Fecha FROM dbo.catFechas
sp.directorio=EXEC dbo.spcQCDirectorio :cliente
sp.credito=EXEC dbo.spcQCCredito :cliente; SELECT * FROM dbo.tmpQCCredito01
sp.muebles=EXEC dbo.spcQCMuebles :cliente
sp.ropa=EXEC dbo.spcQCRopa :cliente
# @iFechaConCorteAl20 = 1: corte al 20
sp.prestamos=EXEC dbo.spcQCPrestamos :cliente, 1
sp.tiempoAire=EXEC dbo.spcQCarteraTiempoAire :cliente
sp.deudaBancoppel=EXEC dbo.spcListadoClientesDeudaBancoppel :cliente
sp.reestructuras=EXEC dbo.spcQCReestructuras :cliente
sp.cpMuebles=EXEC dbo.spcQCCPMuebles :cliente
sp.cpRopa=EXEC dbo.spcQCCPRopa :cliente
sp.cpPrestamos=EXEC dbo.spcQCCPPrestamos :cliente
# El procedimiento solo crea tmpDineroElectronico3 si fun_ObtenerConfiguracionFlag(7) es 0 o 1
sp.dineroElectronico=EXEC dbo.spcQCDineroElectronico :cliente; IF OBJECT_ID('dbo.tmpDineroElectronico3') IS NOT NULL SELECT * FROM dbo.tmpDineroElectronico3
# Situaciones especiales y, para la hoja impresa, domicilio para localizar, referencias y teléfonos
sp.informativa=EXEC dbo.proc_carterainformativa :cliente; SELECT * FROM dbo.tmp_CteSituacionEsp; IF OBJECT_ID('dbo.tmp_CarteraInformativa') IS NOT NULL SELECT * FROM dbo.tmp_CarteraInformativa; SELECT * FROM dbo.tmp_CteReferencia; SELECT * FROM dbo.tmp_CteTelefono
sp.marcasContacto=EXEC dbo.proc_clientenocontactado :cliente; SELECT * FROM dbo.tmp_clientenocontactado
# Lo que revisa proc_clientenocontactado, pero al corte y no a catFechas: si los datos son posteriores al corte,
# la marca se rehace con esto sin contar convenios, situaciones de abogado (área 5, proceso 90) ni movimientos
# posteriores. movimientoPosterior avisa que alguna FechaUltimoMov ya es posterior y la anterior se perdió.
sp.contactoAlCorte=DECLARE @c INT = :cliente, @corte SMALLDATETIME = :corte; WITH f (mov, convenio) AS (SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maeCarteraRopa WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maeCarteraMuebles WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maePrestamos WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maeTiempoAire WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maeCarteraRevolvente WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maeCarteraReestructura WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, FechaDelConvenio FROM dbo.maeCarteraDeudaBancoppel WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasRopa WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasMuebles WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasPrestamos WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasTiempoAire WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasRevolvente WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasReestructura WHERE NumeroCliente = @c UNION ALL SELECT FechaUltimoMov, NULL FROM dbo.maeSaldadasCarteraDeudaBancoppel WHERE NumeroCliente = @c) SELECT (SELECT MAX(x) FROM (SELECT mov AS x FROM f UNION ALL SELECT convenio FROM f) m WHERE x <= @corte) AS ultimoMovimiento, CASE WHEN EXISTS (SELECT 1 FROM f WHERE mov > @corte) THEN 1 ELSE 0 END AS movimientoPosterior, CASE WHEN EXISTS (SELECT 1 FROM dbo.mae_clientessituaciones s JOIN dbo.Ctl_ReglasSituaciones r ON r.idu_situacion = s.idu_situacion JOIN dbo.ctl_subprocesossituaciones p ON p.idu_area = r.idu_area AND p.idu_proceso = r.idu_proceso AND p.idu_regla = r.idu_regla WHERE s.num_cliente = @c AND p.idu_area = 5 AND p.idu_proceso = 90 AND p.idu_subproceso = 1 AND p.num_bloque = 1 AND s.fec_marcado <= @corte) THEN 1 ELSE 0 END AS situacionAbogado, CASE WHEN EXISTS (SELECT 1 FROM dbo.maeTelefonos WHERE NumeroCliente = @c AND Status = 'VC') THEN 1 ELSE 0 END AS telefonoVerificado, CASE WHEN EXISTS (SELECT 1 FROM dbo.mae_correos WHERE num_cliente = @c AND num_estatus IN (2, 4)) THEN 1 ELSE 0 END AS correoConfirmado, (SELECT ISNULL(MAX(CAST(FlagClienteConflicto AS INT)), 0) FROM dbo.maeDirectorio WHERE NumeroCliente = @c) AS conflicto
# Abonos vencidos + meses vencidos por cuenta, la llave de catLeyendasCorreos. Mismo cálculo que
# proc_clientenocontactado (con congelamiento): sus tablas Tmp_*_clientenocontactado para muebles, préstamos,
# Deuda Bancoppel y reestructura, y fun_calculavencidoropa / fun_calculavencidotiempoaire (posiciones 12 y 23).
# Columnas: cartera (nombre de TipoCartera), factura (0 en ropa y tiempo aire) y abonosYMesesVencidos.
sp.abonosYMesesVencidos=DECLARE @c INT = :cliente; EXEC dbo.proc_clientenocontactado @c; DECLARE @f SMALLDATETIME = (SELECT Fecha FROM dbo.catFechas); SELECT 'MUEBLES' AS cartera, NumeroFactura AS factura, AbonosVencidos + Mesesvencidos AS abonosYMesesVencidos FROM dbo.Tmp_MaeCarteraMuebles_clientenocontactado UNION ALL SELECT 'PRESTAMOS', NumeroFactura, AbonosVencidos + Mesesvencidos FROM dbo.Tmp_maePrestamos_clientenocontactado UNION ALL SELECT 'DEUDA_BANCOPPEL', NumeroFactura, AbonosVencidos + Mesesvencidos FROM dbo.Tmp_maeCarteraDeudaBancoppel_clientenocontactado UNION ALL SELECT 'REESTRUCTURA', NumeroFactura, AbonosVencidos + Mesesvencidos FROM dbo.Tmp_maeCarteraReestructura_clientenocontactado UNION ALL SELECT 'ROPA', 0, CAST(SUBSTRING(v, 12, 11) AS INT) + CAST(SUBSTRING(v, 23, 11) AS INT) FROM (SELECT dbo.fun_calculavencidoropa(@f, FechaUltimaCompra, MinimoAPagarMesAct, AbonoBase, Saldo20MesActual, AbonosDelMes, idu_Plazo) AS v FROM dbo.maeCarteraRopa WHERE NumeroCliente = @c AND SaldoAlaFecha > 0) r UNION ALL SELECT 'TIEMPO_AIRE', 0, CAST(SUBSTRING(v, 12, 11) AS INT) + CAST(SUBSTRING(v, 23, 11) AS INT) FROM (SELECT dbo.fun_calculavencidotiempoaire(@f, FechaUltimaCompra, MinimoAPagarMesAct, AbonoBase, Saldo20MesActual, AbonosDelMes, idu_plazo) AS v FROM dbo.maeTiempoAire WHERE NumeroCliente = @c AND SaldoAlaFecha > 0) t
# Catálogo de la leyenda de "AVISO IMPORTANTE" (fnPc2GeCalculaLeyendas lo consulta por letra, número y clave).
# Columnas: letra, número, Leyenda1, Leyenda2, ClaveLeyenda.
sp.leyendasCorreos=SELECT PuntualidadCliente, AbonosMesesVencidos, Leyenda1, Leyenda2, ClaveLeyenda FROM dbo.catLeyendasCorreos
# Situaciones que se imprimen junto al centro (proc_generacadenasituacionescliente): las de tipo 1 y las que la
# configuración Ctl_SubprocesosSituaciones incluye para el proceso. Área 5, proceso 18 es la configuración que
# coincide con las muestras (solo I35); confirmar el proceso de la emisión correos. Formato: clave + causa +
# motivo + persona (I35, S50AB...).
sp.situacionesImpresas=SELECT RTRIM(s.clv_situacion) + CAST(s.num_causasituacion AS varchar(5)) + CASE WHEN m.idu_motivo > 0 THEN ISNULL(RTRIM(c.clv_motivo), '') WHEN m.idu_persona > 0 THEN 'NN' ELSE '' END + CASE WHEN m.idu_motivo > 0 AND m.idu_persona = 0 THEN 'NN' WHEN m.idu_persona > 0 THEN ISNULL(RTRIM(p.clv_persona), '') ELSE '' END AS situacion FROM dbo.Mae_ClientesSituaciones m JOIN dbo.Cat_SituacionesEspeciales s ON s.idu_situacion = m.idu_situacion LEFT JOIN dbo.cat_motivossitesp c ON c.id_motivo = m.idu_motivo LEFT JOIN dbo.cat_personas p ON p.id_persona = m.idu_persona WHERE m.num_cliente = :cliente AND (m.idu_tiposituacion = 1 OR m.idu_situacion IN (SELECT r.idu_situacion FROM dbo.Ctl_SubprocesosSituaciones x JOIN dbo.Ctl_ReglasSituaciones r ON r.idu_area = x.idu_area AND r.idu_proceso = x.idu_proceso AND r.idu_regla = x.idu_regla WHERE x.idu_area = 5 AND x.idu_proceso = 18 AND x.idu_subproceso = 1 AND x.num_bloque = 1 AND RTRIM(x.clv_operacionderegla) = 'IN')) ORDER BY m.idu_tiposituacion
# Iniciales de la ciudad del cliente (ACYN), tercer renglón de los datos del cliente
sp.inicialCiudad=SELECT c.InicialCiudad FROM dbo.maeDirectorio d JOIN dbo.CatCiudades c ON c.NumeroCiudad = d.NumeroCiudad WHERE d.NumeroCliente = :cliente
# Catálogo de bonificaciones: cartera, plazo, días transcurridos, factor y vigencia (fec_iniciobloque).
# Ropa (1) y muebles (2) por día. Préstamos: prc_bonificacion, y prc_bonificacionNueva para compras desde
# fec_corte del renglón -1 (fun_obtieneporcentajebonificacion). Muebles por tipo de producto
# (proc_calculabonificacionmuebles): MOTOS, MUEBLES_BENEFICIOS y COPPELPAY (negocios afiliados). En motos hay días
# repetidos con factor distinto (bloques 0 y 1); la base del laboratorio devuelve el mayor, por eso MAX.
# Si no devuelve renglones se usa bonificaciones.csv.
sp.bonificaciones=SELECT CASE idu_cartera WHEN 1 THEN 'ROPA' ELSE 'MUEBLES' END, idu_plazo, num_diastranscurridos, prc_bonificacion, fec_iniciobloque FROM dbo.cat_bonificacionescarteras WHERE idu_cartera IN (1, 2) AND num_mesestranscurridos = 0 UNION ALL SELECT 'PRESTAMOS', num_plazo, num_diasTranscurridos, prc_bonificacion, fec_iniciobloque FROM dbo.cat_bonificacionesPrestamos WHERE num_diasTranscurridos >= 0 UNION ALL SELECT 'PRESTAMOS', p.num_plazo, p.num_diasTranscurridos, p.prc_bonificacionNueva, n.fec_corte FROM dbo.cat_bonificacionesPrestamos p CROSS JOIN (SELECT TOP 1 fec_corte FROM dbo.cat_bonificacionesPrestamos WHERE num_diasTranscurridos = -1) n WHERE p.num_diasTranscurridos >= 0 AND p.num_bloque = 0 UNION ALL SELECT 'MOTOS', idu_plazo, num_diastranscurridos, MAX(prc_bonificacion), fec_iniciobloque FROM dbo.CAT_BONIFICACIONESMOTOS GROUP BY idu_plazo, num_diastranscurridos, fec_iniciobloque UNION ALL SELECT 'MUEBLES_BENEFICIOS', num_plazo, num_diastranscurridos, prc_bonificacion, fec_inicio FROM dbo.cat_bonificacion_muebles_beneficios UNION ALL SELECT 'COPPELPAY', num_plazo, num_diastranscurridos, prc_bonificacion, fec_inicio FROM dbo.cat_bonificacionescoppelpay
# Configuración de proc_calculabonificacionmuebles
sp.mueblesDiasAjuste=SELECT idu_tipo_producto, num_dias_ajuste FROM dbo.cat_configuracion_muebles_beneficios
sp.mueblesVentaFutura=SELECT idu_plazo FROM dbo.cat_plazosmuebles WHERE clv_flagventafuturo = 1
sp.mueblesNegocioAfiliado=SELECT DISTINCT TipoProducto FROM dbo.catnegocios WHERE TipoCta = 2
sp.mueblesBonificacionPropia=SELECT ClaveTipoProducto, fec_iniciobonif FROM dbo.catTipoProducto WHERE clv_bonifMuebles = 1 AND fec_iniciobonif <> '19000101'
sp.mueblesArranqueNegocioAfiliado=SELECT des_valor FROM dbo.cat_configuracionnegocioafiliados WHERE nom_nemonico = 'FECHA_BONIFICACION_NA_MP'

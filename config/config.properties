# ==========================================================
#  Configuración de Consulta de Clientes
#  Este archivo debe estar en la MISMA carpeta que ConsultaClientes.exe
#
#  - Cada consulta debe tener un solo "?" que se reemplaza
#    por el número de cliente.
#  - En este archivo la barra invertida se escribe doble: \\
#  - Usa un usuario de base de datos de SOLO LECTURA.
# ==========================================================

# ---------- Logo (opcional) ----------
# Imagen PNG o JPG en la misma carpeta que este archivo.
# Si no existe, la ventana se muestra sin logo.
logo.archivo=logo.png

# ---------- SQL Server (Carteras) ----------
# Instancia con nombre: jdbc:sqlserver://servidor-sql\\INSTANCIA;databaseName=Carteras;...
# trustServerCertificate=true evita errores con certificados autofirmados.
sqlserver.nombre=Carteras
sqlserver.url=jdbc:sqlserver://servidor-sql:1433;databaseName=Carteras;encrypt=true;trustServerCertificate=true
sqlserver.usuario=usuario_lectura
sqlserver.password=cambiar_esto
sqlserver.consulta=SELECT * FROM dbo.maeDirectorio WHERE NumeroCliente = ?

# ==========================================================
#  Configuración del Validador de estados de cuenta
#  Este archivo debe estar en la MISMA carpeta que ValidadorEdoCta.exe
#
#  - En este archivo la barra invertida se escribe doble: \\
#  - Los procedimientos crean tablas tmp*: ver permisos en el README.
# ==========================================================

# ---------- Origen de datos ----------
# sqlserver = consulta la base Carteras
# demo      = datos de ejemplo sin base de datos (clientes ficticios 10000001 y 10000002, corte 20/09/2026)
modo=sqlserver

# ---------- Logo (opcional) ----------
# Imagen PNG o JPG en la misma carpeta que este archivo.
logo.archivo=logo.png

# ---------- Catálogo de bonificaciones ----------
# Si los factores cambian, editar este archivo (junto al .exe) y volver a abrir la aplicación;
# no hace falta recompilar. Si no existe, se usa la copia incluida en el programa.
bonificaciones.archivo=bonificaciones.csv

# ---------- Leyenda de mercadotecnia del mes [17] ----------
# Cambia cada mes: copiarla de la carpeta Leyendas Mercadotecnia (las capturadas del 16 al 20).
leyenda.mercadotecnia=VIVE TU LOOK ESTA TEMPORADA LA MODA OTOÑO-INVIERNO TE INSPIRA A ESTRENAR DESCUBRE OUTFITS, CALZADO, ACCESORIOS Y MAS VISTE TU HISTORIA CON COPPEL

# ---------- SQL Server (Carteras) ----------
# Instancia con nombre: jdbc:sqlserver://servidor-sql\\INSTANCIA;databaseName=Carteras;...
sqlserver.nombre=Carteras
sqlserver.url=jdbc:sqlserver://servidor-sql:1433;databaseName=Carteras;encrypt=true;trustServerCertificate=true
sqlserver.usuario=usuario_lectura
sqlserver.password=cambiar_esto

# ---------- Procedimientos de los listados (VbnListadoCarteras\Scripts) ----------
# :cliente se reemplaza por el número de cliente (@NumCte) y :corte por la fecha de corte.
# Algunos procedimientos no devuelven filas: dejan el resultado en una tabla tmp*, por eso
# van seguidos de un SELECT. Dejar vacío para omitir un listado.
#
# IMPORTANTE: los procedimientos crean y borran tablas tmp* en dbo, así que el usuario necesita
# permiso para hacerlo. El validador ejecuta cada listado en una transacción que se deshace al
# terminar (ROLLBACK): la base queda igual.
sp.directorio=EXEC dbo.spcQCDirectorio :cliente
sp.credito=EXEC dbo.spcQCCredito :cliente; SELECT * FROM dbo.tmpQCCredito01
sp.muebles=EXEC dbo.spcQCMuebles :cliente
sp.ropa=EXEC dbo.spcQCRopa :cliente
# @iFechaConCorteAl20 = 1: corte al 20
sp.prestamos=EXEC dbo.spcQCPrestamos :cliente, 1
sp.tiempoAire=EXEC dbo.spcQCarteraTiempoAire :cliente
sp.deudaBancoppel=EXEC dbo.spcListadoClientesDeudaBancoppel :cliente
sp.reestructuras=EXEC dbo.spcQCReestructuras :cliente
sp.cpMuebles=EXEC dbo.spcQCCPMuebles :cliente
sp.cpRopa=EXEC dbo.spcQCCPRopa :cliente
sp.cpPrestamos=EXEC dbo.spcQCCPPrestamos :cliente
# El procedimiento solo crea tmpDineroElectronico3 si fun_ObtenerConfiguracionFlag(7) es 0 o 1
sp.dineroElectronico=EXEC dbo.spcQCDineroElectronico :cliente; IF OBJECT_ID('dbo.tmpDineroElectronico3') IS NOT NULL SELECT * FROM dbo.tmpDineroElectronico3
sp.informativa=EXEC dbo.proc_carterainformativa :cliente; SELECT * FROM dbo.tmp_CteSituacionEsp
sp.marcasContacto=EXEC dbo.proc_clientenocontactado :cliente; SELECT * FROM dbo.tmp_clientenocontactado
# Iniciales de la ciudad del cliente (ACYN) que van en el tercer renglón de los datos del cliente
sp.inicialCiudad=SELECT c.InicialCiudad FROM dbo.maeDirectorio d JOIN dbo.CatCiudades c ON c.NumeroCiudad = d.NumeroCiudad WHERE d.NumeroCliente = :cliente

# ---------- Nombres de columna (opcional) ----------
# Cada dato se busca por varios nombres posibles. Si en la pestaña "Listados > Avisos" aparece
# "No se encontró la columna para muebles.saldoFecha", indicar aquí el nombre real:
# columna.muebles.saldoFecha=SaldoALaFecha
# columna.ropa.vencido=Vencido2

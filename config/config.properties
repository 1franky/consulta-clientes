# ==========================================================
#  Configuración del Validador de estados de cuenta
#  Este archivo debe estar en la MISMA carpeta que ValidadorEdoCta.exe
#  (la barra invertida se escribe doble: \\)
# ==========================================================

# sqlserver = consulta la base Carteras
# demo      = datos de ejemplo sin base de datos (clientes ficticios 10000001 y 10000002, corte 20/09/2026)
modo=sqlserver

# ---------- SQL Server (Carteras) ----------
# El usuario necesita ejecutar los procedimientos y crear/borrar sus tablas tmp* (ver README).
# Instancia con nombre: jdbc:sqlserver://servidor-sql\\INSTANCIA;databaseName=Carteras;...
sqlserver.url=jdbc:sqlserver://servidor-sql:1433;databaseName=Carteras;encrypt=true;trustServerCertificate=true
sqlserver.usuario=usuario_lectura
sqlserver.password=cambiar_esto
